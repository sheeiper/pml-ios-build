name: PMLNative

options:
  bundleIdPrefix: com.personalmedialibrary
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PMLNative:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: PMLNative
        excludes:
          - Info.plist
    info:
      path: PMLNative/Info.plist
      properties:
        CFBundleDisplayName: 私人媒体库
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 需要访问本地媒体流服务
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalmedialibrary.native
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: PMLNative/PMLCore.h
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor"
        OTHER_LDFLAGS:
          - "-lpersonal_media_library_core"
          - "-ObjC"
          - "-lz"
